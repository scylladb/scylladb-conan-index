patches:
  "3.0.0-rc.0":
    - patch_file: "patches/3.0.0-rc.0-0001-clockbound-h-cxx-include.patch"
      patch_description: >-
        Make clockbound.h includable from C++ as is: add extern "C" guards, and hide the
        errno macro while struct clockbound_err, which has a field named errno, is declared
      patch_type: "portability"
