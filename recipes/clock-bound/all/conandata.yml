sources:
  "3.0.0-rc.0":
    # aws/clock-bound at the commit ScyllaDB's clock-bound submodule points to (tag 3.0.0-rc.0)
    url: "https://github.com/aws/clock-bound/archive/371058f8f6a1786d4a4ab3eed9f5f2f16eea7777.tar.gz"
